<div class="login-page">
  <div class="bg-image"></div>
  <div class="bg-overlay"></div>

  <div class="login-content">
    <div class="login-left">
      <div class="eyebrow">StudentPlanner</div>
      <h1>Study calmly.<br />Plan beautifully.</h1>
      <p>
        Organize tasks, subjects and reminders in one cozy workspace.
        Stay focused and keep your academic life under control.
      </p>
    </div>

    <div class="login-card">
      <div class="card-glow"></div>

      <h2>Login</h2>
      <p class="subtitle">Welcome back to StudentPlanner</p>

      <div class="form-group">
        <input [(ngModel)]="username" type="text" placeholder="Username" />
      </div>

      <div class="form-group">
        <input [(ngModel)]="password" type="password" placeholder="Password" />
      </div>

      <button (click)="login()">Login</button>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <p class="bottom-text">
        Don’t have an account?
        <a routerLink="/register">Register</a>
      </p>
    </div>
  </div>
</div>
